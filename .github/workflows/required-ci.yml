name: Required CI

# Always runs on PRs to staging/main so branch rules can require one stable check.
# See docs/github-branch-protection.md
on:
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require SHA-pinned Actions
        run: .github/scripts/check-github-action-pins.sh

      - name: Gate map
        run: |
          set -euo pipefail
          echo "FUBoot Tours is a static VRML archive + X_ITE localhost players."
          echo "Path-filtered Deploy / Terraform / CodeQL gates are not present yet."
          echo "Required CI = Actions SHA-pin check only until hosting CI is added."
