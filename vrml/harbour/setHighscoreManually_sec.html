 <SCRIPT language="JavaScript">

     <!-- Hide from older browsers

  var myCookie = document.cookie;
  var name = "FUBOOTTOURS_test";

  function setCookie() {
    var value = document.setCookieForm.nameField.value + ": " + document.setCookieForm.scoreField.value;
    var today = new Date();
    document.cookie = "FUBOOTTOURS_test=" + escape(value) + "; expires=" + new Date(today.getTime() + 3153600000).toGMTString();
    myCookie = document.cookie; // update cookie
  }

  function delCookie() {
    var value = "";
    document.cookie = "FUBOOTTOURS_test=" + escape(value);
    myCookie = document.cookie; // update cookie
  }

  function getCookie(name) { // use: getCookie("n");
    var index = myCookie.indexOf(name + "=");
    if (index == -1) return null;
    index = myCookie.indexOf("=", index) + 1;
    var endstr = myCookie.indexOf(";", index);
    if (endstr == -1) endstr = myCookie.length;
    return unescape(myCookie.substring(index, endstr));
  }

  function checkName() {
    var index = myCookie.indexOf("FUBOOTTOURS_test=");
    if (index == -1) {
       document.welcomeForm.welcome.value = "No highscore registered.";
       return;
    }
    index = myCookie.indexOf("=", index) + 1;
    var midstr = myCookie.indexOf("%20", index);
    if (midstr == -1) midstr = myCookie.length;
    var endstr = myCookie.indexOf(";", index);
    if (endstr == -1) endstr = myCookie.length;
    if (myCookie != null && myCookie != "" && index!=endstr) {
       var sname  = unescape(myCookie.substring(index, midstr - 3));
       var sscore = unescape(myCookie.substring(midstr + 1, endstr));
       document.welcomeForm.welcome.value = sname + " got " + sscore + " points!";
    }
    else document.welcomeForm.welcome.value = "No highscore registered.";
  }

     // Stop hiding -->


</SCRIPT>
