<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FUBoot Tours — X_ITE frameset</title>
  <!--
    Classic layout: tiny save frame (highscore bridge) + X_ITE world + bottom strip.
    Play without highscore: open play.html instead.
  -->
</head>
<frameset rows="1,*,50" border="0" frameborder="0">
  <frame src="save.html" name="save" scrolling="no" noresize>
  <frame src="play.html" name="cont" noresize>
  <frame src="blank.html" name="bottom" scrolling="no" noresize>
</frameset>
</html>
